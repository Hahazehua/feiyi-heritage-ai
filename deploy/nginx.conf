upstream haha_app {
    server app:8501;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Don't leak the Nginx version in error pages / headers.
    server_tokens off;

    # Streamlit keeps a long-lived websocket open; without these the UI
    # reconnects every 60s and loses session state.
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;

    location / {
        proxy_pass http://haha_app;
    }

    # Streamlit's own health endpoint, handy for uptime checks.
    location /_stcore/health {
        proxy_pass http://haha_app;
        access_log off;
    }
}
