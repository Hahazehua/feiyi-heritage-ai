services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: haha-heritage:latest
    container_name: haha-app
    restart: unless-stopped
    env_file:
      - ../.env
    # Bound to loopback only — the app is never reachable from the internet
    # except through Nginx. Do not change this to 0.0.0.0:8501.
    ports:
      - "127.0.0.1:8501:8501"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: haha-nginx
    restart: unless-stopped
    depends_on:
      - app
    # The competition host blocks 80/443/8080/8443, so publish on 8000.
    # Nginx still listens on 80 inside the container; only the host port moves.
    ports:
      - "${HOST_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
